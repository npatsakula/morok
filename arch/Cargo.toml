[package]
name = "svod-arch"

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Architecture-level algorithms for the Svod ML compiler"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
snafu = "0.9"
svod-runtime = { version = "=0.1.0-alpha.4", path = "../runtime" }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }

[dev-dependencies]
proptest = "1.9"
serde_json = "1.0"
test-case = "3.3.1"

[features]
default = ["serde", "hf-tokenizers"]
serde = ["dep:serde"]
# The HuggingFace `tokenizers` adapter (`HfTokenizer` / `Encoding::from_hf`).
# The `Tokenizer` trait + `Encoding` struct stay always-available, so a downstream
# user wiring their own tokenizer can opt out and skip the `onig` build.
hf-tokenizers = ["dep:tokenizers"]
