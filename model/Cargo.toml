[package]
name = "svod-model"
authors.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bon = "3.9.1"
hf-hub = "0.5.0"
hound = "3.5.1"
svod-arch = { path = "../arch", version = "=0.1.0-alpha.3" }
svod-device = { path = "../device", version = "=0.1.0-alpha.3" }
svod-dtype = { path = "../dtype", version = "=0.1.0-alpha.3" }
svod-ir = { path = "../ir", version = "=0.1.0-alpha.3" }
svod-macros = { path = "../macros", version = "=0.1.0-alpha.3" }
svod-runtime = { path = "../runtime", version = "=0.1.0-alpha.3" }
svod-tensor = { path = "../tensor", version = "=0.1.0-alpha.3" }
ndarray.workspace = true
prost = "0.14.3"
nom = "8.0"
realfft = "3.5.0"
repugnant-pickle = { version = "0.0.1", features = ["torch"] }
safetensors = "0.7.0"
zip = { version = "6.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
snafu = "0.9.0"
tracing-subscriber = "0.3.23"

[dev-dependencies]
bytemuck = "1.25.0"
clap = { version = "4.5", features = ["derive"] }
svod-schedule = { path = "../schedule", version = "=0.1.0-alpha.3", features = ["testing"] }
ndarray-npy = "0.10"
tempfile = "3.27.0"
test-case = "3.3.1"
