[package]
name = "svod-tk2"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "From-scratch Rust tile-IR DSL: interned tile-IR, verified lowering, strategy-combinator pass runner (Step 1 skeleton)"
autobenches = false # explicit [[bench]] entries below; `benches/common.rs` is a shared module, not a bench

[dependencies]
svod-dtype = { path = "../dtype", version = "=0.1.0-alpha.3" }
svod-ir = { path = "../ir", version = "=0.1.0-alpha.3" }
svod-schedule = { path = "../schedule", version = "=0.1.0-alpha.3" }
svod-codegen = { path = "../codegen", version = "=0.1.0-alpha.3" }
svod-device = { path = "../device", version = "=0.1.0-alpha.3" }
svod-runtime = { path = "../runtime", version = "=0.1.0-alpha.3" }
svod-tensor = { path = "../tensor", version = "=0.1.0-alpha.3" }
smallvec = { workspace = true }
snafu = "0.8.9"
bon = "3.9.3"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.11.0"
test-case = "3.3.1"

# GPU device-time bench (criterion) sharing `benches/common.rs`.
[[bench]]
name = "matmul"
harness = false

# GPU device-time bench for the FA-forward schedule (criterion) sharing `benches/common.rs`.
[[bench]]
name = "fa"
harness = false

[[bench]]
name = "fa32"
harness = false

# SCRATCH DCC-inflation bench (NOT committed) — sharing `benches/common.rs`.
[[bench]]
name = "matmul_dsl_dcc"
harness = false
