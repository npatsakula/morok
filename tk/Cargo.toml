[package]
name = "svod-tk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ThunderKittens-style tile DSL for authoring hand-tuned GPU kernels (gfx942)"
autobenches = false # explicit [[bench]] entries below; `benches/common.rs` is a shared module, not a bench

[dependencies]
svod-dtype = { path = "../dtype", version = "=0.1.0-alpha.3" }
svod-ir = { path = "../ir", version = "=0.1.0-alpha.3" }
svod-tensor = { path = "../tensor", version = "=0.1.0-alpha.3" }
smallvec = { workspace = true }
snafu = "0.8.9"
svod-codegen = { path = "../codegen", version = "=0.1.0-alpha.3" }
svod-device = { path = "../device", version = "=0.1.0-alpha.3" }
svod-runtime = { path = "../runtime", version = "=0.1.0-alpha.3" }
svod-schedule = { path = "../schedule", version = "=0.1.0-alpha.3" }

[dev-dependencies]
svod-schedule = { path = "../schedule", features = ["testing"] }
proptest = "1.9"
test-case = "3.3.1"
criterion = { version = "0.8", features = ["html_reports"] }
ndarray.workspace = true # native CPU baseline for the knn bench
libloading = "0.8" # dlopen the optional Nix-built vendor shims (benches/vendor.rs)

# GPU device-time benches (criterion), one binary per kernel sharing `benches/common.rs`.
# Self-skip when no AMD GPU; run one with e.g. `SVOD_DEVICE=AMD:0 cargo bench -p svod-tk --bench knn`.
[[bench]]
name = "fa"
harness = false

[[bench]]
name = "kmeans"
harness = false

[[bench]]
name = "knn"
harness = false

[[bench]]
name = "matmul"
harness = false

# Vendor-floor comparison (hipBLASLt GEMM via the Nix-built shim). Standalone and
# svod-free — HIP can't share a process with svod's KFD backend; run it on its own
# with the shim on LD_LIBRARY_PATH (the flake `bench` dev shell).
[[bench]]
name = "vendor"
harness = false
