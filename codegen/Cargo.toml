[package]
name = "svod-codegen"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend code generation for the Svod ML compiler"
readme = "README.md"

[dependencies]
svod-dtype = { path = "../dtype", version = "=0.1.0-alpha.3" }
svod-ir = { path = "../ir", version = "=0.1.0-alpha.3" }
svod-device = { path = "../device", version = "=0.1.0-alpha.3" }
svod-schedule = { path = "../schedule", version = "=0.1.0-alpha.3" }
snafu = "0.9.0"
itertools = "0.15.0"
tracing = "0.1"
melior = { version = "0.27.2", features = ["ods-dialects"], optional = true }
smallvec.workspace = true

[features]
default = []
# Enable trace-level spans in hot paths (compile-time control)
tracing-verbose = []
mlir = ["dep:melior"]

[dev-dependencies]
test-case = "3.3.1"
