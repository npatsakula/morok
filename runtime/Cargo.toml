[package]
name = "svod-runtime"

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Kernel execution runtime for the Svod ML compiler"
readme = "README.md"

[dependencies]
svod-dtype = { path = "../dtype", version = "=0.1.0-alpha.5" }
svod-device = { path = "../device", version = "=0.1.0-alpha.5" }
svod-ir = { path = "../ir", version = "=0.1.0-alpha.5" }
svod-codegen = { path = "../codegen", version = "=0.1.0-alpha.5" }
snafu = "0.8.9"
parking_lot = "0.12"
once_cell = "1.21"
libc = "0.2"
papaya = "0.2.3"
rayon = "1.11"
tracing = "0.1"
libloading = "0.8"
tempfile = { version = "3", optional = true }
object = { version = "0.38", default-features = false, features = [
  "elf",
  "read",
] }
sha2 = "0.10"
memmap2 = "0.9"
libffi = "5.1.0"
smallvec = { workspace = true }

[dev-dependencies]
test-case = "3.3.1"
tempfile = "3"

[features]
default = []
dlopen-fallback = ["dep:tempfile"]
cuda = ["svod-device/cuda"]
# Enable trace-level spans in hot paths (compile-time control)
tracing-verbose = []
